global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'inference-service'
    static_configs:
      - targets: ['inference-service:8000']
    scrape_interval: 2s
    scrape_timeout: 1s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 5s
    scrape_timeout: 4s
