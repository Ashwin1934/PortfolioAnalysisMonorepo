version: '3.8'

services:
  # gRPC Inference Service
  inference-service:
    build:
      context: ../InferenceService
      dockerfile: Dockerfile
    container_name: inference-service
    ports:
      - "50051:50051"
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../InferenceService/model.pt:/app/model.pt
    networks:
      - inference-network
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; stub = grpc.insecure_channel('localhost:50051'); print('ok')"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI Ingestion Service
  ingestion-service:
    build:
      context: ../IngestionService
      dockerfile: Dockerfile
    container_name: ingestion-service
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - INFERENCE_SERVICE_HOST=inference-service
      - INFERENCE_SERVICE_PORT=50051
    env_file:
      - ../IngestionService/.env
    depends_on:
      inference-service:
        condition: service_healthy
    networks:
      - inference-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - inference-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # cAdvisor for container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - inference-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3001"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - inference-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  inference-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
